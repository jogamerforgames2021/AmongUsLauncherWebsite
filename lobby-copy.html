<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Copy lobby code</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#090909;
  --red:#c8151b;
  --text:#f0f0f2;
  --muted:rgba(240,240,242,.55);
  --dim:rgba(240,240,242,.09);
  --green:#3fae5a;
  --amber:#f5b83d;
  --f:'Share Tech Mono',monospace;
}

html,body{height:100%;}
body{
  font-family:var(--f);
  background:var(--bg);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9;
}

.box{
  position:relative;z-index:1;
  text-align:center;
  padding:0 1.6rem;
  max-width:560px;
}

.brand{
  display:flex;align-items:center;gap:.7rem;
  font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(240,240,242,.3);
  margin-bottom:1.4rem;
}
.brand::before,.brand::after{content:'';flex:1;height:1px;background:var(--dim);}
.brand b{color:var(--red);font-weight:bold;}

.code{
  font-size:clamp(3.2rem,15vw,7rem);
  font-weight:bold;letter-spacing:.14em;line-height:1;
  color:var(--text);
  cursor:pointer;
  user-select:all;
  outline:none;
  transition:color .12s;
}
.code:hover{color:var(--red);}

.hint{
  font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(240,240,242,.25);
  margin-top:1.1rem;
  min-height:1.1em;
}

.actions{
  display:flex;gap:.8rem;align-items:center;justify-content:center;
  margin-top:2rem;
}
.raw-btn{
  font-family:var(--f);
  font-size:.7rem;letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--text);
  background:transparent;
  border:1px solid rgba(240,240,242,.2);
  padding:.8rem 1.6rem;
  cursor:pointer;text-decoration:none;
  transition:border-color .1s,color .1s;
}
.raw-btn:hover{border-color:var(--red);color:var(--red);animation:btn-glitch .22s steps(1) infinite;}
.raw-btn.solid{border-color:rgba(200,21,27,.5);color:var(--red);}
.raw-btn.solid:hover{background:rgba(200,21,27,.06);}
.raw-btn:disabled{opacity:.4;pointer-events:none;}
@keyframes btn-glitch{
  0%,100%{transform:translate(0);}
  25%{transform:translate(-1px,1px);}
  50%{transform:translate(1px,-1px);}
  75%{transform:translate(-1px,0);}
}

#status{
  font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  margin-top:1.2rem;
  min-height:1.4em;
}
#status.ok{color:var(--green);}
#status.no{color:var(--amber);}
#status.wait{color:var(--muted);animation:blink 1s steps(1) infinite;}

.back{
  display:inline-block;
  margin-top:1.6rem;
  font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(240,240,242,.28);
  text-decoration:none;
  transition:color .12s;
}
.back:hover{color:var(--red);}

@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><b>AU LAUNCHER</b> LOBBY CODE</div>
  <div class="code" id="code" tabindex="-1">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</div>
  <div class="hint" id="hint">tap the code or use the button</div>
  <div class="actions">
    <button class="raw-btn solid" id="copy-btn">[ COPY CODE ]</button>
  </div>
  <div id="status" class="wait">// waiting</div>
  <a class="back" id="back" href="/lobby">view lobby &rarr;</a>
</div>

<script>
(function () {
  'use strict';

  var CODE_RE = /^[QWXRTYLPESDFGHUJKZOCVBINMA]{6}$/;
  var code = String(new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();

  if (!CODE_RE.test(code)) {
    location.replace('/lobby');
    return;
  }

  var codeEl = document.getElementById('code');
  var btn = document.getElementById('copy-btn');
  var statusEl = document.getElementById('status');
  var backEl = document.getElementById('back');

  codeEl.textContent = code;
  document.title = code + ' \u2014 lobby code';
  backEl.href = '/lobby/' + code;
  backEl.textContent = 'view lobby /lobby/' + code + ' \u2192';

  var range = document.createRange();
  range.selectNodeContents(codeEl);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  codeEl.focus();

  function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = code;
    ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copy() {
    statusEl.className = 'wait';
    statusEl.textContent = '// copying';
    btn.disabled = true;
    var finish = function (ok) {
      if (ok) {
        statusEl.className = 'ok';
        statusEl.textContent = 'COPIED \u2014 ' + code;
        btn.disabled = false;
      } else {
        statusEl.className = 'no';
        statusEl.textContent = 'BLOCKED \u2014 press Ctrl+C (code is selected)';
        btn.disabled = false;
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () { finish(true); }, function () { finish(fallbackCopy()); });
    } else {
      finish(fallbackCopy());
    }
  }

  btn.addEventListener('click', copy);
  codeEl.addEventListener('click', copy);
})();
</script>
</body>
</html>

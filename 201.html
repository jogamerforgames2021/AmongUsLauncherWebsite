<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Still under construction — releasing with AU Launcher 1.4.">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<title>201 // Under Development</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#090909;
  --red:#c8151b;
  --text:#f0f0f2;
  --muted:rgba(240,240,242,.65);
  --dim:rgba(240,240,242,.09);
  --f:'Share Tech Mono',monospace;
}

html{ height:100%; overscroll-behavior-y:none; }

body{
  font-family:var(--f);
  background:var(--bg);
  color:var(--text);
  height:100%;
  overflow:hidden;
}

body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9000;
}

.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:8000;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
}
.scanlines::after{
  content:'';position:absolute;left:0;right:0;height:110px;
  background:linear-gradient(to bottom,transparent,rgba(200,215,255,.04),transparent);
  animation:scan-move 9s linear infinite;
}
@keyframes scan-move{from{top:-15%}to{top:115%}}

.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:7500;
  box-shadow:inset 0 0 16vmax rgba(0,0,0,.78);
}
.vignette::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% 120%,rgba(200,21,27,.07),transparent 60%);
}

#bg-canvas{
  position:fixed;inset:0;
  width:100%;height:100%;
  pointer-events:none;z-index:0;
}

.page-wrap{
  position:relative;z-index:1;
  width:100%;max-width:880px;
  margin:0 auto;
  padding:2rem 1.5rem;
  height:100vh;
  height:100dvh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  transition:transform .28s ease-out;
}

.ph-title{
  position:relative;
  font-size:clamp(3.4rem,11vw,8.5rem);
  line-height:.9;letter-spacing:-.02em;
  font-weight:bold;margin-bottom:.6rem;
  color:var(--text);
  white-space:nowrap;
  animation:floaty 6.5s ease-in-out infinite;
}
.ph-title > span{position:relative;z-index:2;}
.ph-title .slash{color:var(--red);}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.ph-title::before,.ph-title::after{
  content:attr(data-text);
  position:absolute;top:0;left:0;width:100%;height:100%;
  white-space:nowrap;overflow:hidden;
  pointer-events:none;z-index:1;
}
.ph-title::before{
  text-shadow:-2px 0 #ff004c,2px 0 #00fff7;
  animation:glitch-a 4.2s steps(1) infinite;
}
.ph-title::after{
  text-shadow:2px 2px #ff004c,-2px -1px #00fff7;
  animation:glitch-b 3.7s steps(1) infinite;
}
@keyframes glitch-a{
  0%{clip-path:inset(0 0 100% 0)}
  8%{clip-path:inset(18% 0 62% 0);transform:translate(-4px,-2px)}
  16%{clip-path:inset(0 0 100% 0)}
  34%{clip-path:inset(72% 0 8% 0);transform:translate(4px,2px)}
  42%{clip-path:inset(0 0 100% 0)}
  58%{clip-path:inset(38% 0 46% 0);transform:translate(-3px,2px)}
  64%{clip-path:inset(0 0 100% 0)}
  81%{clip-path:inset(86% 0 4% 0);transform:translate(3px,-2px)}
  87%{clip-path:inset(0 0 100% 0)}
  100%{clip-path:inset(0 0 100% 0)}
}
@keyframes glitch-b{
  0%{clip-path:inset(0 0 100% 0)}
  11%{clip-path:inset(64% 0 20% 0);transform:translate(4px,1px)}
  19%{clip-path:inset(0 0 100% 0)}
  37%{clip-path:inset(12% 0 78% 0);transform:translate(-4px,-1px)}
  45%{clip-path:inset(0 0 100% 0)}
  61%{clip-path:inset(48% 0 34% 0);transform:translate(3px,-2px)}
  68%{clip-path:inset(0 0 100% 0)}
  84%{clip-path:inset(90% 0 2% 0);transform:translate(-3px,2px)}
  90%{clip-path:inset(0 0 100% 0)}
  100%{clip-path:inset(0 0 100% 0)}
}

.ph-sub{
  font-size:.8rem;color:var(--muted);
  letter-spacing:.06em;line-height:1.9;margin-bottom:1.5rem;
}

.term{
  width:100%;max-width:680px;
  border:1px solid var(--dim);
  background:rgba(10,10,12,.55);
  text-align:left;
  overflow:hidden;
  margin-bottom:1.6rem;
  box-shadow:0 10px 40px rgba(0,0,0,.45);
}
.term-head{
  display:flex;align-items:center;gap:.7rem;
  padding:.5rem 1rem;
  border-bottom:1px solid var(--dim);
  font-size:.54rem;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(240,240,242,.35);
  background:rgba(240,240,242,.02);
}
.th-dots{display:flex;gap:5px;margin-left:auto;}
.th-dot{width:7px;height:7px;border-radius:50%;background:var(--red);opacity:.9;animation:dot-pulse 1.8s ease infinite;}
.th-dot:nth-child(2){animation-delay:.25s;}
.th-dot:nth-child(3){animation-delay:.5s;}
@keyframes dot-pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.term-body{padding:.8rem 1.05rem .95rem;font-size:.68rem;line-height:1.9;letter-spacing:.045em;color:rgba(240,240,242,.6);min-height:120px;}
.term-body div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-fail{color:#e05565;}
.t-dim{color:rgba(240,240,242,.26);}
.t-cursor{
  display:inline-block;width:.55em;height:1em;
  background:var(--text);
  vertical-align:-2px;
  animation:blink .9s steps(1) infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.ph-path{
  display:inline-block;
  font-size:.6rem;letter-spacing:.12em;
  color:rgba(200,21,27,.9);
  border:1px solid rgba(200,21,27,.35);
  padding:.4rem .9rem;
  margin-bottom:1.8rem;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ph-path::after{
  content:'\2588';margin-left:3px;color:var(--red);
  animation:blink 1.1s steps(1) infinite;
}

.ph-actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
.pa-btn{
  font-family:var(--f);font-size:.6rem;
  letter-spacing:.16em;text-transform:uppercase;
  padding:.85rem 1.8rem;
  text-decoration:none;cursor:pointer;
  border:1px solid var(--dim);color:var(--text);
  transition:border-color .12s,color .12s,background .12s,transform .12s;
  position:relative;overflow:visible;
}
.pa-btn::before,.pa-btn::after{content:none;}
.pa-btn .shine{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.pa-btn .shine::before{
  content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  transition:left .4s;
}
.pa-btn:hover{border-color:var(--red);color:var(--red);transform:translateY(-2px);}
.pa-btn:hover .shine::before{left:160%;}
.pa-btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.pa-btn.primary:hover{background:#e01b22;}

.pa-btn .tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;
  transform:translateX(-50%) translateY(8px);
  background:#0d0d10;
  border:1px solid var(--dim);
  color:var(--muted);
  font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.45rem .75rem;
  white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;
  z-index:5;
}
.pa-btn .tip::after{
  content:'';position:absolute;top:100%;left:50%;margin-left:-4px;
  border:4px solid transparent;border-top-color:rgba(240,240,242,.16);
}
.pa-btn:hover .tip{opacity:1;transform:translateX(-50%) translateY(0);}

.ph-footer{
  margin-top:1.8rem;
  font-size:.54rem;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(240,240,242,.22);
  display:flex;align-items:center;gap:.7rem;
}
.foot-dots{display:flex;gap:5px;}
.foot-dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--red);animation:foot-bounce 1.2s ease infinite;}
.foot-dots span:nth-child(2){animation-delay:.18s;}
.foot-dots span:nth-child(3){animation-delay:.36s;}
@keyframes foot-bounce{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

@media (max-height:640px){
  .ph-title{font-size:clamp(2.6rem,9vw,5rem);}
  .term-body{min-height:96px;line-height:1.7;}
  .ph-sub{margin-bottom:1rem;}
  .ph-path{margin-bottom:1.2rem;}
  .ph-footer{display:none;}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="page-wrap" id="page-wrap">
  <h1 class="ph-title" id="ph-title" data-text="201"><span>2</span><span class="slash">0</span><span>1</span></h1>
  <p class="ph-sub">This page exists, it's just not finished yet. The full site ships with AU Launcher 1.4.</p>

  <div class="term">
    <div class="term-head">
      <span>au-launcher :: build log</span>
      <span class="th-dots"><span class="th-dot"></span><span class="th-dot"></span><span class="th-dot"></span></span>
    </div>
    <div class="term-body" id="term" aria-live="polite"></div>
  </div>

  <span class="ph-path" id="ph-path">/under-construction</span>

  <div class="ph-actions">
    <a class="pa-btn primary" href="/"><span class="shine"></span>Go to Main Page <span class="tip">return to the main page &mdash; everything is safe there</span></a>
    <a class="pa-btn" href="/news"><span class="shine"></span>Go to News Page <span class="tip">still being built, same as this one</span></a>
  </div>

  <div class="ph-footer">
    <span id="foot-text">compiling assets</span>
    <span class="foot-dots"><span></span><span></span><span></span></span>
  </div>
</div>

<script>
'use strict';

document.getElementById('ph-path').textContent = location.pathname || '/';

(function terminal() {
  const term = document.getElementById('term');
  const path = location.pathname || '/';
  const lines = [
    { t: '> inbound: request for "' + path + '"', c: 't-dim' },
    { t: '> scanning site: this page exists', c: '' },
    { t: '> content still being written', c: '' },
    { t: '> status: UNDER CONSTRUCTION', c: 't-fail' },
    { t: '> full site ships with AU Launcher 1.4', c: '' },
  ];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const cursor = document.createElement('span');
  cursor.className = 't-cursor';

  function moveCur(row) { if (cursor.parentNode) cursor.remove(); row.appendChild(cursor); }

  async function typeLine(line) {
    const row = document.createElement('div');
    term.appendChild(row);
    moveCur(row);
    for (let i = 0; i <= line.t.length; i++) {
      row.textContent = line.t.slice(0, i);
      const ch = line.t[i - 1];
      await sleep(ch === '.' || ch === ':' || ch === '"' ? 120 : 16);
    }
    row.classList.add(line.c);
    await sleep(220);
  }

  (async function loop() {
    while (true) {
      term.innerHTML = '';
      for (const l of lines) await typeLine(l);
      cursor.remove();
      await sleep(2600);
      term.style.opacity = 0;
      await sleep(320);
      term.style.opacity = 1;
      await sleep(120);
    }
  })();
})();

(function footer() {
  const text = document.getElementById('foot-text');
  const phrases = ['compiling assets', 'still cooking', 'almost there', 'releasing with au launcher 1.4', 'patience, detective'];
  let i = 0;
  setInterval(() => { text.textContent = phrases[++i % phrases.length]; }, 2600);
})();

(function parallax() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pw = document.getElementById('page-wrap');
  let raf = null;
  window.addEventListener('mousemove', e => {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const nx = e.clientX / window.innerWidth - 0.5;
      const ny = e.clientY / window.innerHeight - 0.5;
      pw.style.transform = 'translate(' + (nx * -12) + 'px,' + (ny * -10) + 'px)';
    });
  });
})();

(function spaceScene() {
  'use strict';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bgC = document.getElementById('bg-canvas');
  const bgX = bgC.getContext('2d');
  let W = 0, H = 0;
  function resize() { W = bgC.width = window.innerWidth; H = bgC.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', () => { resize(); buildStars(); });

  function rnd(a,b){return a+Math.random()*(b-a);}

  const nebulas=[
    {x:0.18,y:0.22,r:0.55,col:'197,17,27',alpha:0.05,dx:0.004,dy:0.002},
    {x:0.82,y:0.12,r:0.45,col:'123,97,255',alpha:0.055,dx:-0.003,dy:0.004},
    {x:0.62,y:0.72,r:0.5,col:'45,120,255',alpha:0.04,dx:0.002,dy:-0.003},
  ];
  function drawNebulas(){
    for(const n of nebulas){
      n.x+=n.dx;n.y+=n.dy;
      if(n.x>1.2)n.x=-0.2; if(n.x<-0.2)n.x=1.2;
      if(n.y>1.2)n.y=-0.2; if(n.y<-0.2)n.y=1.2;
      const cx=n.x*W,cy=n.y*H,rad=Math.max(W,H)*n.r;
      const g=bgX.createRadialGradient(cx,cy,0,cx,cy,rad);
      g.addColorStop(0,'rgba('+n.col+','+n.alpha+')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      bgX.fillStyle=g;
      bgX.fillRect(cx-rad,cy-rad,rad*2,rad*2);
    }
  }

  const DX=0.55, DY=0.83;
  const LAYERS=[
    {count:130,r:[0.4,0.9], sp:0.55, alpha:0.45},
    {count:85, r:[0.7,1.3], sp:1.05, alpha:0.65},
    {count:42, r:[1.1,1.9], sp:1.75, alpha:0.85},
    {count:14, r:[1.7,2.6], sp:2.7,  alpha:1},
  ];
  const stars=[];
  function buildStars(){
    stars.length=0;
    for(const L of LAYERS){
      for(let i=0;i<L.count;i++){
        stars.push({
          x:rnd(0,W),y:rnd(0,H),
          r:rnd(L.r[0],L.r[1]),
          sp:L.sp*rnd(0.7,1.35),
          dx:DX*rnd(0.9,1.1), dy:DY*rnd(0.9,1.1),
          tw:rnd(0,Math.PI*2), twS:rnd(0.004,0.02),
          baseAlpha:L.alpha*rnd(0.55,1),
          col:Math.random()<0.12?'140,190,255':'222,215,255',
        });
      }
    }
  }
  function drawStars(){
    for(const s of stars){
      s.x+=s.dx*s.sp;s.y+=s.dy*s.sp;s.tw+=s.twS;
      if(s.x>W+8)s.x=-8; if(s.x<-8)s.x=W+8;
      if(s.y>H+8)s.y=-8; if(s.y<-8)s.y=H+8;
      const a=s.baseAlpha*(0.6+0.4*Math.sin(s.tw));
      const tx=s.x-s.dx*s.sp*15, ty=s.y-s.dy*s.sp*15;
      const gr=bgX.createLinearGradient(s.x,s.y,tx,ty);
      gr.addColorStop(0,'rgba('+s.col+','+a+')');
      gr.addColorStop(1,'rgba('+s.col+',0)');
      bgX.strokeStyle=gr;
      bgX.lineWidth=Math.max(0.6,s.r*1.1);
      bgX.beginPath();bgX.moveTo(s.x,s.y);bgX.lineTo(tx,ty);bgX.stroke();
    }
  }

  const comets=[];
  let nextCometAt=performance.now()+1400;
  function spawnComet(){
    if(reduceMotion)return;
    const dir=Math.random()<0.5?1:-1;
    comets.push({
      x:dir===1?-30:W+30,
      y:rnd(H*0.08,H*0.55),
      vx:dir*(4.2+Math.random()*3.5),
      vy:(0.8+Math.random()*1.5)*dir,
      life:1,
      decay:0.0035+Math.random()*0.003,
      col:Math.random()<0.85?'222,215,255':'255,210,215',
      big:Math.random()<0.14,
    });
  }
  function drawComets(){
    for(let i=comets.length-1;i>=0;i--){
      const c=comets[i];
      c.x+=c.vx;c.y+=c.vy;c.life-=c.decay;
      if(c.life<=0||c.x<-180||c.x>W+180){comets.splice(i,1);continue;}
      const vlen=Math.hypot(c.vx,c.vy)||1;
      const nx=c.vx/vlen, ny=c.vy/vlen;
      const tailLen=c.big?100:48, segs=c.big?28:15;
      const hr=c.big?4.2:2.4;
      const g=bgX.createRadialGradient(c.x,c.y,0,c.x,c.y,hr*5);
      g.addColorStop(0,'rgba(255,255,255,'+(0.95*c.life)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      bgX.fillStyle=g;
      bgX.beginPath();bgX.arc(c.x,c.y,hr*5,0,Math.PI*2);bgX.fill();
      for(let s=0;s<segs;s++){
        const t=s/segs;
        const a=(1-t)*(1-t)*c.life*0.85;
        bgX.strokeStyle='rgba('+c.col+','+a+')';
        bgX.lineWidth=Math.max(0.4,(1-t)*2.6);
        bgX.beginPath();
        bgX.moveTo(c.x-nx*tailLen*t,c.y-ny*tailLen*t);
        bgX.lineTo(c.x-nx*tailLen*(t+1/segs),c.y-ny*tailLen*(t+1/segs));
        bgX.stroke();
      }
    }
    if(performance.now()>nextCometAt){spawnComet();nextCometAt=performance.now()+3800+Math.random()*5500;}
  }

  buildStars();
  function tick(){
    bgX.clearRect(0,0,W,H);
    drawNebulas();
    drawStars();
    drawComets();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.js" defer></script>
<title>Loading... // Among Us Launcher</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#090909;
  --red:#c8151b;
  --text:#f0f0f2;
  --muted:rgba(240,240,242,.6);
  --dim:rgba(240,240,242,.09);
  --f:'Share Tech Mono',monospace;
}

html{overflow-y:scroll;height:100%;overscroll-behavior-y:none;}

body{
  font-family:var(--f);
  background:var(--bg);
  color:var(--text);
  min-height:100%;
  overflow-x:hidden;
  padding-bottom:5rem;
}

body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9000;
}

#bg-canvas{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}

/* ── NAV ───────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;right:0;
  z-index:600;padding:1.5rem 2.5rem;
  display:flex;gap:2.8rem;pointer-events:none;
}
.nb{
  font-family:var(--f);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;
  background:none;border:none;cursor:pointer;
  pointer-events:all;transition:color .1s;
}
.nb:hover{color:var(--text);}
.nb.active{color:var(--text);}
.nb:nth-child(1){transform:translateY(0px);}
.nb:nth-child(2){transform:translateY(7px);}
.nb:nth-child(3){transform:translateY(-4px);}
.nb:nth-child(4){transform:translateY(9px);}
.nb:nth-child(5){transform:translateY(-2px);}
.bean-toggle-btn{
  margin-left:auto;transform:translateY(3px) !important;
  opacity:.35;transition:opacity .15s !important;
}
.bean-toggle-btn:hover{opacity:.75;}
.bean-toggle-btn.off{opacity:.18;}
.bean-toggle-btn.off::after{content:' off';font-size:.55rem;opacity:.6;}

@keyframes nb-glitch{
  0%,100%{opacity:1;transform:translateX(0);}
  20%{opacity:.5;transform:translateX(-1px);}
  40%{opacity:1;transform:translateX(1px);}
  60%{opacity:.7;transform:translateX(0);}
  80%{opacity:1;}
}
.nb.glitch{animation:nb-glitch .25s steps(1);}
.nb:nth-child(1).glitch{animation:nb-glitch1 .25s steps(1);}
.nb:nth-child(2).glitch{animation:nb-glitch2 .25s steps(1);}
.nb:nth-child(3).glitch{animation:nb-glitch3 .25s steps(1);}
.nb:nth-child(4).glitch{animation:nb-glitch4 .25s steps(1);}
.nb:nth-child(5).glitch{animation:nb-glitch5 .25s steps(1);}
@keyframes nb-glitch1{0%,100%{opacity:1;transform:translateY(0px) translateX(0);}33%{opacity:.4;transform:translateY(0px) translateX(-1px);}66%{opacity:.8;transform:translateY(0px) translateX(1px);}}
@keyframes nb-glitch2{0%,100%{opacity:1;transform:translateY(7px) translateX(0);}33%{opacity:.4;transform:translateY(7px) translateX(-1px);}66%{opacity:.8;transform:translateY(7px) translateX(1px);}}
@keyframes nb-glitch3{0%,100%{opacity:1;transform:translateY(-4px) translateX(0);}33%{opacity:.4;transform:translateY(-4px) translateX(-1px);}66%{opacity:.8;transform:translateY(-4px) translateX(1px);}}
@keyframes nb-glitch4{0%,100%{opacity:1;transform:translateY(9px) translateX(0);}33%{opacity:.4;transform:translateY(9px) translateX(-1px);}66%{opacity:.8;transform:translateY(9px) translateX(1px);}}
@keyframes nb-glitch5{0%,100%{opacity:1;transform:translateY(-2px) translateX(0);}33%{opacity:.4;transform:translateY(-2px) translateX(-1px);}66%{opacity:.8;transform:translateY(-2px) translateX(1px);}}

/* ── PAGE ──────────────────────────────── */
.page-wrap{
  position:relative;z-index:1;
  max-width:720px;margin:0 auto;
  padding:7rem 2.5rem 3rem;
}

/* back link */
.post-back{
  display:inline-flex;align-items:center;gap:.55rem;
  font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(240,240,242,.3);text-decoration:none;
  margin-bottom:2.5rem;
  transition:color .12s;
}
.post-back::before{
  content:'';display:inline-block;
  width:5px;height:5px;
  border-left:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-1px);
  flex-shrink:0;
}
.post-back:hover{color:var(--red);}

/* hero image */
.post-hero{
  width:100%;height:280px;
  overflow:hidden;
  margin-bottom:2.2rem;
  position:relative;
  flex-shrink:0;
}
.post-hero img{
  width:100%;height:100%;
  object-fit:cover;
  opacity:.55;filter:grayscale(.3);
  display:block;
}
.post-hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(9,9,9,0) 40%,rgba(9,9,9,.85) 100%);
}
.post-hero-video video{
  width:100%;height:100%;
  object-fit:cover;display:block;
  background:#000;
}

/* skeleton */
.sk{background:rgba(240,240,242,.04);animation:sk-p 1.6s ease infinite;}
@keyframes sk-p{0%,100%{opacity:.3}50%{opacity:.7}}
.sk-hero{width:100%;height:280px;margin-bottom:2.2rem;}
.sk-line{height:14px;margin-bottom:.75rem;border-radius:0;}
.sk-title{height:48px;width:72%;margin-bottom:1rem;}
.sk-badge{height:18px;width:70px;margin-bottom:1.2rem;}

/* post meta */
.post-meta{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem;flex-wrap:wrap;}
.post-cat{
  font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;
  padding:.25rem .65rem;border:1px solid;
}
.post-cat.Update{border-color:rgba(200,21,27,.35);color:#e05565;}
.post-cat.Announcement{border-color:rgba(0,200,150,.25);color:#00c896;}
.post-cat.Event{border-color:rgba(245,158,11,.25);color:#fbbf24;}
.post-date{font-size:.58rem;color:rgba(240,240,242,.35);letter-spacing:.08em;}

/* title */
.post-title{
  font-size:clamp(1.6rem,4vw,2.4rem);
  font-weight:bold;line-height:1.1;
  letter-spacing:-.02em;
  margin-bottom:.8rem;
}

/* brief */
.post-brief{
  font-size:.8rem;color:var(--muted);
  line-height:1.8;
  border-left:2px solid rgba(200,21,27,.4);
  padding-left:1rem;
  margin-bottom:2rem;
}

/* divider */
.post-rule{
  border:none;border-top:1px solid var(--dim);
  margin:1.8rem 0;
}

/* ── MARKDOWN CONTENT ─────────────────── */
.post-content{
  font-size:.82rem;
  line-height:1.9;
  color:var(--muted);
  margin-bottom:3rem;
}

.post-content h1,
.post-content h2,
.post-content h3,
.post-content h4{
  font-family:var(--f);font-weight:bold;
  color:var(--text);margin:2rem 0 .8rem;
  letter-spacing:.02em;
}
.post-content h1{font-size:1.3rem;border-bottom:1px solid var(--dim);padding-bottom:.5rem;}
.post-content h2{font-size:1.1rem;}
.post-content h3{font-size:.95rem;color:var(--muted);}
.post-content h4{font-size:.82rem;color:rgba(240,240,242,.45);text-transform:uppercase;letter-spacing:.12em;}

.post-content p{margin-bottom:1.1rem;}

.post-content a{
  color:var(--red);text-decoration:none;
  border-bottom:1px solid rgba(200,21,27,.3);
  transition:border-color .12s;
}
.post-content a:hover{border-color:var(--red);}

.post-content img{
  max-width:100%;display:block;
  margin:1.5rem 0;
  opacity:.8;
  border:1px solid var(--dim);
}
.post-content img:hover{opacity:1;}

.post-content video{
  max-width:100%;display:block;
  background:#000;
  outline:none;
}

/* ── VIDEO PLAYER (Plyr — square + dark theme) ─ */
.plyr{
  --plyr-color-main:#c8151b;
  --plyr-font-family:'Share Tech Mono',monospace;
  --plyr-control-radius:0;
  --plyr-video-background:#000;
  --plyr-menu-background:#0e0e10;
  --plyr-menu-color:var(--text);
  --plyr-menu-radius:0;
  --plyr-tooltip-background:#0e0e10;
  --plyr-tooltip-color:var(--text);
  --plyr-tooltip-radius:0;
  --plyr-video-control-color:rgba(240,240,242,.78);
  --plyr-video-control-color-hover:#fff;
  --plyr-video-progress-buffered-background:rgba(240,240,242,.12);
}
.plyr__control--overlaid{
  background:rgba(200,21,27,.85)!important;
  border-radius:0;
  width:56px;height:56px;
  border:1px solid rgba(240,240,242,.2);
}
.plyr--video .plyr__control:hover,.plyr--video .plyr__control[aria-expanded=true]{background:var(--red)!important;color:#fff!important;}
.plyr--full-ui input[type=range]{color:#c8151b;}
.plyr__control,.plyr--full-ui .plyr__control{border-radius:0;}
/* square sliders — no circles */
.plyr--full-ui input[type=range]::-webkit-slider-runnable-track{border-radius:0;}
.plyr--full-ui input[type=range]::-moz-range-track{border-radius:0;}
.plyr--full-ui input[type=range]::-webkit-slider-thumb{border-radius:0;box-shadow:0 0 0 1px rgba(0,0,0,.6);}
.plyr--full-ui input[type=range]::-moz-range-thumb{border-radius:0;box-shadow:0 0 0 1px rgba(0,0,0,.6);}
.plyr--full-ui input[type=range]::-ms-thumb{border-radius:0;}
.plyr__progress__buffer{border-radius:0;}
.plyr__progress__buffer::-webkit-progress-value{border-radius:0;}
.plyr__progress__buffer::-moz-progress-bar{border-radius:0;}
/* dark tooltip — the "which second" readout */
.plyr__tooltip{
  border:1px solid rgba(240,240,242,.15);
  box-shadow:0 2px 10px rgba(0,0,0,.6);
  letter-spacing:.05em;
}
/* solid dark control bar */
.plyr--video .plyr__controls{
  background:linear-gradient(rgba(9,9,9,0) 0%,rgba(9,9,9,.9) 45%,#0e0e10 100%);
}
/* content players */
.post-content .plyr{
  margin:1.5rem 0;
  border:1px solid var(--dim);
  background:#000;
  border-radius:0;
}
.post-content .plyr__video-wrapper{width:100%;height:100%;}
.post-content .plyr__video{width:100%;display:block;}
.post-content .plyr__controls{
  background:#0e0e10;
  border-top:1px solid var(--dim);
}
/* hero player — video fills the strip, controls overlay */
.post-hero-video .plyr{
  position:absolute;inset:0;width:100%;height:100%;
}
.post-hero-video .plyr__video-wrapper{width:100%;height:100%;}
.post-hero-video video{
  width:100%;height:100%;
  object-fit:cover;display:block;
  background:#000;
}

.post-content ul,.post-content ol{
  padding-left:1.4rem;margin-bottom:1.1rem;
}
.post-content li{margin-bottom:.35rem;line-height:1.75;}
.post-content ul li::marker{color:var(--red);}
.post-content ol li::marker{color:var(--red);}

.post-content code{
  font-family:var(--f);font-size:.85em;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:.12rem .42rem;color:#ccc;
}
.post-content pre{
  background:rgba(0,0,0,.5);
  border:1px solid var(--dim);
  border-left:2px solid rgba(200,21,27,.3);
  padding:1.2rem 1.4rem;
  overflow-x:auto;
  margin-bottom:1.4rem;
}
.post-content pre code{
  background:none;border:none;padding:0;
  font-size:.8rem;color:#b5bac1;
}

.post-content blockquote{
  border-left:2px solid rgba(200,21,27,.4);
  padding:.7rem 1rem;margin:1.4rem 0;
  color:rgba(240,240,242,.45);
  font-size:.8rem;line-height:1.75;
}

.post-content hr{
  border:none;border-top:1px solid var(--dim);
  margin:1.8rem 0;
}

.post-content table{
  width:100%;border-collapse:collapse;
  margin-bottom:1.4rem;font-size:.78rem;
}
.post-content th{
  background:rgba(255,255,255,.04);
  padding:.6rem .9rem;text-align:left;
  border:1px solid var(--dim);
  color:var(--text);letter-spacing:.06em;
}
.post-content td{
  padding:.6rem .9rem;border:1px solid var(--dim);
  color:var(--muted);
}
.post-content tr:hover td{background:rgba(255,255,255,.02);}

/* error state */
.post-error{
  padding:3rem 0;
  font-size:.8rem;color:rgba(240,240,242,.3);
  letter-spacing:.06em;line-height:2;
}
.post-error a{color:var(--red);text-decoration:none;}
.post-error a:hover{text-decoration:underline;}

/* ── HUB DRAWER (copied from /news) ─ */
@keyframes hub-glow{
  0%,60%,100%{box-shadow:none;border-color:var(--dim);}
  30%{box-shadow:0 -4px 18px rgba(200,21,27,.35);border-color:rgba(200,21,27,.5);}
}
@keyframes hub-bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}
@keyframes dot-pulse{0%,60%,100%{opacity:.35;transform:scale(1);}30%{opacity:1;transform:scale(1.6);}}
#hub-drawer{
  position:fixed;bottom:0;left:0;right:0;z-index:700;
  background:rgba(10,10,12,.98);border-top:1px solid var(--dim);
  display:flex;flex-direction:column;
  height:calc(48vh + 3rem);
  transition:transform .38s cubic-bezier(.22,1,.36,1);
  transform:translateY(calc(100% - 3rem));
}
#hub-drawer.open{transform:translateY(0);}
#hub-tab{
  flex-shrink:0;height:3rem;
  font-family:var(--f);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--text);background:rgba(14,14,16,.95);
  border:none;border-bottom:1px solid var(--dim);border-top:2px solid rgba(200,21,27,.0);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.75rem;
  animation:hub-glow 2.4s ease infinite;transition:border-top-color .2s;
}
#hub-tab.open{animation:none;border-top-color:var(--red);}
#hub-tab:hover{animation:none;}
.hub-dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;animation:dot-pulse 2.4s ease infinite;flex-shrink:0;}
#hub-tab.open .hub-dot{animation:none;opacity:1;}
.hub-label{font-weight:bold;letter-spacing:.3em;}
.hub-arrow{display:inline-block;font-size:.6rem;transition:transform .32s cubic-bezier(.22,1,.36,1);animation:hub-bounce 2.4s ease infinite;opacity:.6;}
#hub-tab.open .hub-arrow{transform:rotate(180deg);animation:none;}
.drawer-inner{flex:1;display:flex;overflow:hidden;padding:1.4rem 2.4rem 1rem;gap:2.5rem;}
.drawer-news{flex:1.5;display:flex;flex-direction:column;overflow:hidden;}
.drawer-news-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1rem;}
.drawer-news-label{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);}
.drawer-news-viewall{font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,240,242,.28);text-decoration:none;transition:color .12s;}
.drawer-news-viewall:hover{color:var(--red);}
.dn-list{display:flex;flex-direction:column;gap:0;overflow:hidden;}
.dn-item{display:flex;gap:.9rem;align-items:flex-start;padding:.7rem 0;border-bottom:1px solid var(--dim);cursor:pointer;}
.dn-item:first-child{border-top:1px solid var(--dim);}
.dn-item:hover .dn-title{color:var(--red);}
.dn-badge{font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;flex-shrink:0;margin-top:2px;border:1px solid;}
.dn-badge.Update{border-color:rgba(200,21,27,.3);color:#e05565;}
.dn-badge.Announcement{border-color:rgba(0,200,150,.25);color:#00c896;}
.dn-badge.Event{border-color:rgba(245,158,11,.25);color:#fbbf24;}
.dn-title{font-size:.72rem;line-height:1.4;flex:1;transition:color .1s;}
.dn-date{font-size:.56rem;color:var(--muted);margin-top:3px;letter-spacing:.06em;}
.dn-item a{text-decoration:none;color:inherit;}
.dn-state{font-size:.65rem;letter-spacing:.08em;color:rgba(240,240,242,.25);padding:.8rem 0;}
.drawer-sep{width:1px;background:var(--dim);flex-shrink:0;}
.drawer-support{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:.85rem;}
.ds-label{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);}
.ds-desc{font-size:.66rem;color:var(--muted);line-height:1.65;}
.ds-links{display:flex;flex-direction:column;gap:.38rem;}
.ds-link{
  font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;border:1px solid var(--dim);
  padding:.5rem .85rem;display:flex;align-items:center;gap:0;
  position:relative;overflow:hidden;transition:border-color .18s;
}
.ds-link::before{content:'';position:absolute;inset:0;background:var(--red);transform:translateX(-101%);transition:transform .22s cubic-bezier(.22,1,.36,1);z-index:0;}
.ds-link:hover{border-color:var(--red);}
.ds-link:hover::before{transform:translateX(0);}
.ds-link-icon{position:relative;z-index:1;width:14px;height:14px;flex-shrink:0;margin-right:.6rem;display:flex;align-items:center;}
.ds-link-icon svg{width:100%;height:100%;fill:currentColor;}
.ds-link-arrow{position:relative;z-index:1;width:10px;height:10px;flex-shrink:0;margin-right:.7rem;display:flex;align-items:center;justify-content:center;color:rgba(240,240,242,.28);transition:color .1s,transform .15s;}
.ds-link-arrow::before{content:'';display:inline-block;width:5px;height:5px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:rotate(45deg) translateX(-1px);}
.ds-link-text{position:relative;z-index:1;flex:1;color:var(--muted);transition:color .1s;}
.ds-link:hover .ds-link-icon,.ds-link:hover .ds-link-arrow,.ds-link:hover .ds-link-text{color:#000;}
.ds-link:hover .ds-link-arrow{transform:translateX(3px);}
.drawer-footer{padding:.7rem 2.4rem;border-top:1px solid var(--dim);display:flex;align-items:center;justify-content:space-between;font-size:.58rem;letter-spacing:.07em;color:rgba(235,235,237,.2);}
.df-links{display:flex;gap:1.6rem;align-items:center;}
.df-links a{color:rgba(235,235,237,.3);text-decoration:none;font-size:1.15rem;transition:color .12s,transform .12s;display:flex;align-items:center;}
.df-links a:hover{color:var(--text);transform:translateY(-1px);}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- NAV -->
<div id="nav">
  <a class="nb" href="/">Home</a>
  <a class="nb" href="/helpPage">Docs</a>
  <a class="nb" href="/news">News</a>
  <a class="nb" href="/developer">Dev</a>
  <a class="nb" href="https://discord.com/invite/7Vvj2vpT6S" target="_blank">Discord</a>
  <button class="nb bean-toggle-btn" id="bean-toggle-btn" onclick="toggleBeans()" title="toggle beans">◉ beans</button>
</div>

<!-- POST -->
<div class="page-wrap">
  <a class="post-back" href="/news">All News</a>

  <!-- hero — swapped in by JS -->
  <div id="post-hero"></div>

  <!-- header skeleton -->
  <div id="post-header">
    <div class="sk sk-badge" style="width:72px;margin-bottom:1rem;"></div>
    <div class="sk sk-title"></div>
    <div class="sk sk-line" style="width:90%"></div>
    <div class="sk sk-line" style="width:70%"></div>
  </div>

  <hr class="post-rule" id="post-rule" style="display:none;">

  <!-- content skeleton -->
  <div id="post-content" class="post-content" style="opacity:.4;">
    <div class="sk sk-line"></div>
    <div class="sk sk-line" style="width:85%"></div>
    <div class="sk sk-line" style="width:92%"></div>
    <div class="sk sk-line" style="width:60%"></div>
  </div>
</div>

<!-- HUB DRAWER -->
<div id="hub-drawer">
  <button id="hub-tab" onclick="toggleHub()">
    <span class="hub-dot"></span>
    <span class="hub-label">HUB</span>
    <span class="hub-arrow">&#9650;</span>
  </button>
  <div class="drawer-inner">
    <div class="drawer-news">
      <div class="drawer-news-header">
        <div class="drawer-news-label">// Latest News</div>
        <a class="drawer-news-viewall" href="/news">View all news //</a>
      </div>
      <div class="dn-list" id="dn-list">
        <div class="dn-state" id="dn-state">Loading...</div>
      </div>
    </div>
    <div class="drawer-sep"></div>
    <div class="drawer-support">
      <div class="ds-label">// Support</div>
      <p class="ds-desc">Something broken? Pop into the Discord.</p>

<script>
'use strict';

// ── BEAN TOGGLE ────────────────────────────
let beansEnabled = localStorage.getItem('beans') !== 'off';
window.__beansEnabled = beansEnabled;
function toggleBeans() {
  beansEnabled = !beansEnabled;
  localStorage.setItem('beans', beansEnabled ? 'on' : 'off');
  window.__beansEnabled = beansEnabled;
  document.getElementById('bean-toggle-btn').classList.toggle('off', !beansEnabled);
}
if (!beansEnabled) document.getElementById('bean-toggle-btn').classList.add('off');

// ── NAV GLITCH ────────────────────────────
document.querySelectorAll('.nb').forEach(btn => {
  btn.addEventListener('mouseenter', () => {
    btn.classList.add('glitch');
    setTimeout(() => btn.classList.remove('glitch'), 280);
  });
});

// ── HUB DRAWER ────────────────────────────
let hubOpen = false;
function toggleHub() {
  hubOpen = !hubOpen;
  document.getElementById('hub-drawer').classList.toggle('open', hubOpen);
  document.getElementById('hub-tab').classList.toggle('open', hubOpen);
}

// ── POST LOADER ────────────────────────────
const NEWS_BASE = '/news/';

function getSlug() {
  const m = window.location.pathname.match(/^\/post\/([^/]+)/);
  if (m) return m[1];
  return new URLSearchParams(window.location.search).get('slug');
}

function isVideo(u) {
  return /\.(mp4|webm|ogv|mov)([?#].*)?$/i.test(u);
}

function initPlyr(root) {
  if (typeof Plyr === 'undefined') { setTimeout(() => initPlyr(root), 50); return; }
  root.querySelectorAll('video.post-video').forEach(v => {
    if (v.dataset.plyrReady) return;
    v.dataset.plyrReady = '1';
    new Plyr(v, {
      controls: ['play-large','play','progress','current-time','mute','volume','fullscreen'],
      hideControls: false,
      resetOnEnd: true,
    });
  });
}

function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
}

function parseFrontmatter(md) {
  const m = md.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if (!m) return { meta:{}, content:md };
  const meta = {};
  m[1].split('\n').forEach(line => {
    const [k,...v] = line.split(':');
    if (k) meta[k.trim()] = v.join(':').trim().replace(/^["']|["']$/g,'');
  });
  return { meta, content:m[2] };
}

async function loadPost() {
  const slug = getSlug();
  if (!slug) { window.location.href = '/news'; return; }

  try {
    const [idxRes, mdRes] = await Promise.all([
      fetch(NEWS_BASE + 'index.json'),
      fetch(NEWS_BASE + 'posts/' + slug + '.md'),
    ]);
    const posts   = await idxRes.json();
    const mdText  = await mdRes.text();
    const { meta, content } = parseFrontmatter(mdText);
    const pm = posts.find(p => p.slug === slug) || {};

    const title    = pm.title    || meta.title    || 'Untitled';
    const brief    = pm.brief    || meta.brief    || '';
    const date     = pm.date     || meta.date     || '';
    const category = pm.category || meta.category || 'Update';
    const cover    = pm.cover    || meta.cover    || meta.video || '';

    document.title = title + ' // Among Us Launcher';

    // hero
    const heroEl = document.getElementById('post-hero');
    if (cover) {
      if (isVideo(cover)) {
        heroEl.innerHTML = `<div class="post-hero post-hero-video"><video class="post-video" src="${cover}" preload="metadata" playsinline></video></div>`;
      } else {
        heroEl.innerHTML = `<div class="post-hero"><img src="${cover}" alt=""></div>`;
      }
      initPlyr(heroEl);
    }

    // header
    document.getElementById('post-header').innerHTML = `
      <div class="post-meta">
        <span class="post-cat ${category}">${category}</span>
        <span class="post-date">${fmtDate(date)}</span>
      </div>
      <h1 class="post-title">${title}</h1>
      ${brief ? `<p class="post-brief">${brief}</p>` : ''}`;

    // divider
    document.getElementById('post-rule').style.display = '';

    // content — wait for marked to be available
    let markedReady = false;
    function renderContent() {
      if (typeof marked === 'undefined') { setTimeout(renderContent, 50); return; }
      if (!markedReady) {
        marked.use({
          renderer: {
            image(href, title, text) {
              if (isVideo(href)) {
                return `<video class="post-video" src="${href}" preload="metadata" playsinline></video>`;
              }
              return `<img src="${href}" alt="${text}"${title ? ` title="${title}"` : ''}>`;
            }
          }
        });
        markedReady = true;
      }
      const contentEl = document.getElementById('post-content');
      contentEl.style.opacity = '1';
      contentEl.innerHTML = marked.parse(content);
      initPlyr(contentEl);
    }
    renderContent();

  } catch {
    document.getElementById('post-hero').innerHTML = '';
    document.getElementById('post-header').innerHTML = `
      <div class="post-error">
        // Post not found or couldn't be loaded.<br>
        <a href="/news">← Back to News</a>
      </div>`;
    document.getElementById('post-content').innerHTML = '';
    document.getElementById('post-rule').style.display = 'none';
  }
}
loadPost();

// ── HUB NEWS ──────────────────────────────
(async function loadHubNews() {
  const dnList  = document.getElementById('dn-list');
  const dnState = document.getElementById('dn-state');
  try {
    const res = await fetch(NEWS_BASE + 'index.json');
    if (!res.ok) throw new Error();
    const posts = await res.json();
    if (!posts.length) throw new Error();
    dnState && dnState.remove();
    posts.sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,4).forEach(p => {
      const cat  = p.category || 'Update';
      const date = new Date(p.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const item = document.createElement('div');
      item.className = 'dn-item';
      item.innerHTML = `<span class="dn-badge ${cat}">${cat.toUpperCase()}</span>
        <div><a href="/post/${p.slug}"><div class="dn-title">${p.title}</div></a><div class="dn-date">${date}</div></div>`;
      dnList.appendChild(item);
    });
  } catch {
    if (dnState) dnState.textContent = '// Failed to fetch latest news';
  }
})();

// ── CANVAS — STARS + BEANS ────────────────
(function spaceScene() {
  const bgC = document.getElementById('bg-canvas');
  const bgX = bgC.getContext('2d');
  let W=0,H=0;
  function resize(){W=bgC.width=window.innerWidth;H=bgC.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',()=>{resize();buildStars();});

  function rnd(a,b){return a+Math.random()*(b-a);}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}

  const STAR_RADII=[0.55,0.95,1.55,2.40,3.60];
  const starSprites=[];
  function bakeStarSprites(){
    starSprites.length=0;
    for(const r of STAR_RADII){
      const sz=Math.ceil(r*2+8)|1;
      const c=document.createElement('canvas');c.width=c.height=sz;
      const cx=c.getContext('2d');const half=sz/2;
      const g=cx.createRadialGradient(half,half,0,half,half,half);
      g.addColorStop(0,'rgba(222,215,255,1)');
      g.addColorStop(r/half,'rgba(195,185,255,0.60)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=g;cx.fillRect(0,0,sz,sz);
      starSprites.push(c);
    }
  }
  const STAR_LAYERS=[
    {count:180,si:0,alpha:0.20,drift:0.006},
    {count:110,si:1,alpha:0.38,drift:0.018},
    {count:65, si:2,alpha:0.60,drift:0.040},
    {count:22, si:3,alpha:0.82,drift:0.085},
    {count:7,  si:4,alpha:1.00,drift:0.050},
  ];
  const stars=[];
  function buildStars(){
    stars.length=0;
    for(const L of STAR_LAYERS)
      for(let i=0;i<L.count;i++)
        stars.push({x:rnd(0,W),y:rnd(0,H),si:L.si,baseAlpha:L.alpha*rnd(0.5,1.0),drift:rnd(-1,1)*L.drift,tw:rnd(0,Math.PI*2),twS:rnd(0.003,0.016)});
  }
  function drawStars(){
    for(const s of stars){
      s.x+=s.drift;if(s.x<-8)s.x=W+8;if(s.x>W+8)s.x=-8;
      s.tw+=s.twS;
      const a=s.baseAlpha*(0.55+0.45*Math.sin(s.tw));
      const sp=starSprites[s.si];if(!sp)continue;
      bgX.globalAlpha=a;bgX.drawImage(sp,s.x-sp.width*0.5,s.y-sp.height*0.5);
    }
    bgX.globalAlpha=1;
  }

  const PALETTE=[
    {body:[197,17,17],shadow:[122,8,8],outline:[30,0,0]},
    {body:[19,46,209],shadow:[9,21,142],outline:[0,10,50]},
    {body:[17,127,45],shadow:[10,77,27],outline:[0,20,0]},
    {body:[237,84,186],shadow:[171,43,131],outline:[60,0,40]},
    {body:[239,125,13],shadow:[180,62,21],outline:[50,20,0]},
    {body:[245,245,87],shadow:[194,135,34],outline:[60,40,0]},
    {body:[63,71,78],shadow:[30,31,38],outline:[10,10,10]},
    {body:[107,47,187],shadow:[76,30,149],outline:[20,0,40]},
    {body:[56,254,220],shadow:[36,173,158],outline:[0,50,50]},
    {body:[80,239,57],shadow:[21,167,38],outline:[10,40,0]},
  ];
  const VM=[146,166,176],VS=[113,141,152];

  function recolor(img,pal){
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const cx=c.getContext('2d');cx.drawImage(img,0,0);
    const id=cx.getImageData(0,0,c.width,c.height),d=id.data;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<10)continue;
      const r=d[i],g=d[i+1],b=d[i+2];
      if(r>200&&g<50&&b<50){d[i]=pal.body[0];d[i+1]=pal.body[1];d[i+2]=pal.body[2];}
      else if(r<50&&g<50&&b>200){d[i]=pal.shadow[0];d[i+1]=pal.shadow[1];d[i+2]=pal.shadow[2];}
      else if(r<50&&g<50&&b<150){d[i]=pal.outline[0];d[i+1]=pal.outline[1];d[i+2]=pal.outline[2];}
      else if(g>200&&r<50&&b<50){d[i]=VM[0];d[i+1]=VM[1];d[i+2]=VM[2];}
      else if(g>100&&g<200&&r<50&&b<50){d[i]=VS[0];d[i+1]=VS[1];d[i+2]=VS[2];}
    }
    cx.putImageData(id,0,0);return c;
  }

  let templates=[],beanReady=false;
  const beanImg=new Image();beanImg.crossOrigin='anonymous';beanImg.src='bean.png';
  beanImg.onload=()=>{
    templates=[...PALETTE].sort(()=>Math.random()-0.5).map(p=>recolor(beanImg,p));
    beanReady=true;buildBeans();
  };
  beanImg.onerror=()=>{beanReady=false;};

  const BEANS_FAR=[],MAX_FAR=18,BEANS_NEAR=[],MAX_NEAR=10;
  function mkFar(){return{x:rnd(0,W),y:rnd(0,H),vx:rnd(0.05,0.22),vy:rnd(-0.02,0.02),rot:rnd(0,Math.PI*2),vrot:rnd(-0.002,0.002),size:rnd(10,26),alpha:rnd(0.07,0.16),face:Math.random()<0.5?1:-1,tmpl:null};}
  function mkNear(){return{x:rnd(0,W),y:rnd(0,H),vx:rnd(0.08,0.28),vy:rnd(-0.04,0.04),rot:rnd(0,Math.PI*2),vrot:rnd(-0.003,0.003),size:rnd(36,62),alpha:rnd(0.32,0.56),face:Math.random()<0.5?1:-1,tmpl:null};}
  function buildBeans(){
    BEANS_FAR.length=0;BEANS_NEAR.length=0;
    for(let i=0;i<MAX_FAR;i++){const b=mkFar();b.tmpl=pick(templates);BEANS_FAR.push(b);}
    for(let i=0;i<MAX_NEAR;i++){const b=mkNear();b.tmpl=pick(templates);BEANS_NEAR.push(b);}
  }
  function drawLayer(beans){
    for(const b of beans){
      b.x+=b.vx;b.y+=b.vy;b.rot+=b.vrot;
      if(b.x-b.size>W){b.x=-b.size;b.y=rnd(0,H);}
      if(!b.tmpl)continue;
      bgX.save();bgX.globalAlpha=b.alpha;
      bgX.translate(b.x,b.y);bgX.rotate(b.rot);bgX.scale(b.face,1);
      bgX.drawImage(b.tmpl,-b.size/2,-b.size/2,b.size,b.size);
      bgX.restore();
    }
    bgX.globalAlpha=1;
  }

  bakeStarSprites();buildStars();
  function tick(){
    bgX.clearRect(0,0,W,H);
    drawStars();
    if(beanReady && window.__beansEnabled!==false){drawLayer(BEANS_FAR);drawLayer(BEANS_NEAR);}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
